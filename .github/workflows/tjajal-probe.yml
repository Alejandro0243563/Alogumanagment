name: TJAJAL Probe
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Test date plus patrimonial category route
        shell: bash
        run: |
          python -m pip install --quiet selenium
          python - <<'PY'
          import time
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.common.by import By
          from selenium.webdriver.support.ui import WebDriverWait, Select
          BASE="https://tjajal.gob.mx/boletines"
          opts=Options();opts.add_argument("--headless=new");opts.add_argument("--no-sandbox");opts.add_argument("--disable-dev-shm-usage");opts.add_argument("--window-size=1600,1400")
          d=webdriver.Chrome(options=opts);w=WebDriverWait(d,30)
          try:
            for pubdate in ["2026-08-14","2026-06-04"]:
              d.get(BASE);w.until(lambda x:x.execute_script("return document.readyState")=="complete");w.until(lambda x: len(x.find_elements(By.NAME,"FAcuerdo"))>0)
              f=d.find_element(By.NAME,"FAcuerdo");f.clear();f.send_keys(pubdate)
              Select(d.find_element(By.NAME,"Sala")).select_by_value("21")
              d.find_element(By.CSS_SELECTOR,'input[type="submit"][value="Filtrar"]').click();time.sleep(3)
              print("DATE_QUERY",pubdate,"Sala=21")
              rows=d.find_elements(By.CSS_SELECTOR,"td.tdtoggle")
              exact=[]
              for td in rows:
                sala=(td.get_attribute("sala") or "").strip().upper()
                if sala=="PLENORP":
                  exact.append(td)
                  print("PLENORP_ROW",repr(td.get_attribute("expediente")),repr(td.text))
              print("PLENORP_COUNT",len(exact))
              for td in exact:
                d.execute_script("arguments[0].click();",td);time.sleep(1)
                print("PLENORP_DETAIL",repr(td.text[:5000]))
          finally:d.quit()
          PY
